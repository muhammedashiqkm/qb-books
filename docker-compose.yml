services:
  qb-books:
    build: .
    image: qb-books:latest
    container_name: qb-books
    restart: unless-stopped

    # An init process as PID 1, which is tini rather than Python.
    #
    # The reader starts a Tesseract process per page and Python does not reap
    # the finished ones - as PID 1 nothing else does either, so they pile up as
    # zombies until Docker cannot even stop the container ("PID is zombie and
    # can not be killed"). tini reaps them and passes signals through, so stop
    # and restart behave.
    init: true

    # The port comes from .env, the same value the service listens on inside -
    # change it in one file and this mapping, the health check and a local
    # `run.ps1` all follow.
    #
    # Published on every interface, because the portal is on another machine.
    #
    # Two things stand in front of the books, and BOTH have to be there:
    # QB_BOOKS_API_KEY set in .env (the service has no login of its own), and a
    # firewall rule allowing this port from the portal's address only. Bind it
    # back to 127.0.0.1 the day the portal moves onto this host.
    ports:
      - "${QB_BOOKS_PORT:-8081}:${QB_BOOKS_PORT:-8081}"

    environment:
      QB_BOOKS_PORT: "${QB_BOOKS_PORT:-8081}"
      QB_BOOKS_OCR_LANGS: "${QB_BOOKS_OCR_LANGS:-mal+eng}"
      # Matches the portal's "QbBooksApiKey".
      QB_BOOKS_API_KEY: "${QB_BOOKS_API_KEY:-}"
      # Pages read at once. Leave a core for the rest of the machine; on a
      # shared box, fewer.
      QB_BOOKS_PAGE_WORKERS: "${QB_BOOKS_PAGE_WORKERS:-4}"
      # How many read books are kept before the oldest are dropped.
      QB_BOOKS_KEEP: "${QB_BOOKS_KEEP:-20}"

    volumes:
      - qb-books-data:/data

    # OCR is CPU-bound and will take whatever it is given. The limit keeps one
    # long book from starving whatever else runs on the host.
    deploy:
      resources:
        limits:
          cpus: "${QB_BOOKS_CPUS:-4}"
          memory: 2g

volumes:
  qb-books-data:
